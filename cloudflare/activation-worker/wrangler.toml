# Activation decision service. See worker.js for what this is and why.
#
# The shared secret is NOT here — set it out of band, once per environment:
#   npx wrangler secret put SHARED_SECRET
#
# Apply the D1 schema:
#   npx wrangler d1 execute ts-activation --remote --file=./schema.sql
#
# database_id is an identifier, not a credential: reaching the database still
# requires an account API token. It is committed so the binding is reproducible.

name = "ts-activation"
main = "worker.js"
compatibility_date = "2026-08-02"

# No public route on purpose. Only Supabase Postgres calls this, over the
# workers.dev hostname, with the shared secret.
workers_dev = true

# Off deliberately. Preview URLs would publish every version of this Worker on
# its own guessable hostname; for a service that owns activation, one reachable
# surface is enough.
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "ts-activation"
database_id = "978813d3-eeb3-4697-9d73-241242d0cfde"

# First-mint fence on /v1/devices/enroll (security review C2, 2026-09-16 — see anonFirstMintFenced
# in worker.js). A token for a listed app is minted WITHOUT a matching activation serial only
# while the row's activated_at is younger than the window; older = {status:'refused',
# reason:'first_mint_guard'} + an 'enroll_guard_refused' audit row. Postgres applies the same rule
# first (migration 20260924_enroll_first_mint_guard); this is the copy on the deciding side.
# Both lines commented = fence OFF: deploying this file alone changes nothing. To turn it on,
# uncomment (or `wrangler deploy --var ANON_FIRST_MINT_WINDOW_MIN:360`) — keep the minutes equal
# to cf.settings token_first_mint_activation_window_min so the two sides agree.
# [vars]
# ANON_FIRST_MINT_WINDOW_MIN = "360"
# ANON_FIRST_MINT_APPS = "controller"

[observability]
enabled = true
