name = "thabthaba-programs-admin"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Vendor scripts/fonts under ./public/vendor — the Worker runs first (Access, headers) and hands
# /vendor/* to the assets binding itself.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# The page is bundled into the Worker as text; copy the latest panel here before deploying
# (deploy.cmd does it). It carries only the public Supabase anon key.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[vars]
SUPABASE_URL = "https://ihgmqwzdpugdzddobhbc.supabase.co"
SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZ21xd3pkcHVnZHpkZG9iaGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NTI4ODAsImV4cCI6MjA5ODIyODg4MH0.xG0ch3u5rcbb81pSa8wmybeEYj8kz2LjCGQM_-Xg6Yk"
ADMIN_UID = "5b8e1336-ce54-4dd9-bd23-243158c178fe"
CTRL_TELEMETRY_URL = "https://qghyelhgusphkathgkom.supabase.co"
ACCESS_TEAM_DOMAIN = "thabthaba-store.cloudflareaccess.com"
