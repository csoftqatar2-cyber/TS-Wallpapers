ACCESS_ALLOWED_EMAILS = "csoftqatar4@gmail.com,csoftqatar2@gmail.com"
CTRL_TELEMETRY_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnaHllbGhndXNwaGthdGhna29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMzU5MDUsImV4cCI6MjA5ODkxMTkwNX0.1FT6mF7apILQE1IEn3HVvnDOkKixomvlGLI5zud0pD8"
# Web Push (push.mjs): the VAPID public key browsers subscribe with. Its private half is the secret
# VAPID_PRIVATE_JWK (set 2026-09-15). Rotating means a new pair AND every device re-enabling push.
VAPID_PUBLIC_KEY = "BGfn3g2fC27vpHvw1H45aKiv0oKyWCDto_YDjLjs9hSralcMevK4VOQTyXe7g77cxBCqNIQrYiHAHtnh_K3ZRNc"
# Controller telemetry source: "cloudflare" (thab-voice AdminTelemetry) or "supabase" (the old proxy — the
# one-line rollback). TELEMETRY_BRIDGE "on" pulls rows that cars <= 2.30.15 still post to Supabase into D1 every
# minute; set "off" once no car below 2.30.16 remains. CTRL_MIRROR_CONFIG "on" also publishes the fuel price and
# glossary to Supabase, because those old cars read their config from there.
CTRL_SOURCE = "cloudflare"
TELEMETRY_BRIDGE = "off"
CTRL_MIRROR_CONFIG = "off"

# Every minute: new activations (D1 devices_audit) and new site logins (security_events) → Web Push, and the
# controller telemetry bridge from Supabase (telemetry-admin.mjs runTelemetryBridge).
[triggers]
crons = ["* * * * *"]

# Secrets (never in this file): STORE_ADMIN_SECRET, TSLINK_ADMIN_TOKEN, LEO_ADMIN_TOKEN,
# G700_ADMIN_TOKEN (tsdash-checkin), LYNK_ADMIN_TOKEN (ts-lynk-report), CONTROLLER_ADMIN_SECRET,
# VAPID_PRIVATE_JWK (Web Push signing key, push.mjs), CATALOG_PUBLISH_SECRET (bearer for POST /catalog/publish; the same value is a GitHub Actions secret
# in the TS-Wallpapers repo so release.yml can call the route).

# The store bucket itself: POST /catalog/publish reads/writes catalog/apps.json and puts the mirrored
# APK at apks/<packageName>.apk. Same bucket the store's public host pub-3d6cc5a5…r2.dev serves.
[[r2_buckets]]
binding = "CATALOG_R2"
bucket_name = "thabthaba"

# Same D1 as the activation Worker: the generator writes minted codes here and reads their state.
[[d1_databases]]
binding = "DB"
database_name = "ts-activation"
database_id = "978813d3-eeb3-4697-9d73-241242d0cfde"

# Sibling Workers are reached through service bindings (public workers.dev fetches between Workers of
# the same account fail with error 1042).
[[services]]
binding = "TSLINK_SVC"
service = "tslink-bot"

[[services]]
binding = "LEO_SVC"
service = "tsleo-checkin"

# TS G700 and TS Lynk & Co keep their own activation backends; the panel reads them GET-only with
# G700_ADMIN_TOKEN / LYNK_ADMIN_TOKEN injected in the Worker.
[[services]]
binding = "G700_SVC"
service = "tsdash-checkin"

[[services]]
binding = "LYNK_SVC"
service = "ts-lynk-report"

[[services]]
binding = "UPLOAD_SVC"
service = "ts-wallpapers-upload"

# The voice proxy (holds the OpenRouter key). Bound to its AdminCredits RPC entrypoint, not to its
# public fetch handler: credits() returns only the balance numbers and has no public route at all.
[[services]]
binding = "VOICE_SVC"
service = "thab-voice"
entrypoint = "AdminCredits"

# The voice model router (Google keys, limits, thinking, usage) — thab-voice's AdminRouter RPC
# entrypoint. Reached only behind isAdmin() at /local/voice-router*; never returns a key value.
[[services]]
binding = "VOICE_ROUTER_SVC"
service = "thab-voice"
entrypoint = "AdminRouter"

# TS Tank activation backend (com.thabthaba.tstank). Reached over a service binding to thab-voice's
# AdminTank RPC entrypoint; the D1 and code space live in that Worker, not here.
[[services]]
binding = "TANK"
service = "thab-voice"
entrypoint = "AdminTank"

# Remote diagnostics «استعلام عن بُعد» — thab-voice's AdminDiag RPC entrypoint (no public route). Reached
# only behind isAdmin() at /local/diag*. The request-signing PRIVATE key is the secret DIAG_SIGNING_JWK of
# THIS Worker (ECDSA P-256 JWK, kid k1); thab-voice holds only the public half.
[[services]]
binding = "DIAG_SVC"
service = "thab-voice"
entrypoint = "AdminDiag"

# Controller telemetry on Cloudflare (2026-09-21, telemetry-admin.mjs). The records old cars sent to Supabase
# (events, cars, crashes, config) now live in thab-voice's D1 `thab-telemetry` and are read through its
# AdminTelemetry entrypoint — method = the old thab_admin_* RPC name without the prefix, same args, same JSON.
[[services]]
binding = "TELEMETRY_SVC"
service = "thab-voice"
entrypoint = "AdminTelemetry"

# Quran / adhkar / reminders / prayer usage per car (thab-voice worker/src/usage.js, UsageHub).
[[services]]
binding = "USAGE"
service = "thab-voice"
entrypoint = "AdminUsage"

# Trips, charges and refuels per car (summaries only, no GPS points) — thab-voice's AdminTrips.
[[services]]
binding = "TRIPS_SVC"
service = "thab-voice"
entrypoint = "AdminTrips"
